services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-chatbot-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: rag-chatbot-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://raguser:ragpassword@db:5432/ragdb
      FASTEMBED_CACHE_PATH: /code/model_cache

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - uploads_data:/code/uploads
      - model_cache:/code/model_cache

    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
  uploads_data:
  model_cache:
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-chatbot-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: